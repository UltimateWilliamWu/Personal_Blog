name: Deploy Quartz to GitHub Pages

on:
  push:
    branches: [ v4 ]   # ← 如果你的分支是 v4，请改成 v4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build Quartz (production)
        env:
          NODE_ENV: production
        run: npx quartz build

      - name: Ensure static assets exist
        run: |
          mkdir -p public/static
          cp -rvu static/* public/static/ || true

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4